services:
  jradio-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jradio-livekit-azuracast-relay
    env_file:
      - .env
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
